[project]
name = "api"
version = "0.1.0"
description = "Chat API: SSE streaming over chatbot-core"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chatbot-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[project.scripts]
chat-api = "api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
