[project]
name = "mcp-platform"
version = "0.1.0"
description = "Base platform for MCP-backed chatbots, stamped into per-project variants"
requires-python = ">=3.11,<3.14"

[tool.uv.workspace]
# Projects are deliberately NOT members. A project is config, documents, and a
# tools module -- not a Python package. Globbing them in made `uv` fail the
# moment a project was stamped, because a freshly created project has no
# pyproject.toml and never should.
members = [
    "packages/chatbot-core",
    "packages/mcp-server-core",
    "services/api",
    "services/control",
]

[tool.uv.sources]
chatbot-core = { workspace = true }
mcp-server-core = { workspace = true }
api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=5.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src", "services/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 flags function calls in argument defaults, which is exactly how FastAPI
# declares dependencies. These are evaluated once at import to build the
# dependency graph, not per call, so the mutable-default hazard B008 exists to
# catch does not apply.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/chatbot-core/tests",
    "packages/mcp-server-core/tests",
    "services/api/tests",
    "services/control/tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
